<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Admin - EduLogNBS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ... (semua style yang sudah ada, tidak diubah) ... */
        .tab-content { transition: all 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .table-wrapper { overflow-x: auto; border-radius: 0.75rem; }
        .kelas-card:active { transform: scale(0.98); }
        @media (max-width: 640px) {
            .container { padding-left: 0.75rem; padding-right: 0.75rem; }
            .table-wrapper table { font-size: 0.8rem; }
            .table-wrapper td, .table-wrapper th { padding: 0.5rem 0.25rem; }
        }
        .loading-spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(0,0,0,0.1);
            border-radius: 50%;
            border-top-color: #4f46e5;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .modal-container {
            background: white;
            border-radius: 1rem;
            max-width: 95vw;
            width: auto;
            max-height: 90vh;
            overflow: auto;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-header {
            position: sticky;
            top: 0;
            background: white;
            z-index: 10;
            border-bottom: 1px solid #e5e7eb;
        }
        @media (max-width: 640px) {
            .modal-container { width: 98vw; }
            .modal-container table { font-size: 0.7rem; }
            .modal-container td, .modal-container th { padding: 0.4rem 0.2rem; }
        }
        .member-list {
            max-height: 200px;
            overflow-y: auto;
        }
        .member-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            border-bottom: 1px solid #e5e7eb;
        }
        .member-item:hover {
            background-color: #f9fafb;
        }
        .remove-member {
            color: #ef4444;
            cursor: pointer;
            font-weight: bold;
            padding: 0 4px;
        }
        .remove-member:hover {
            color: #b91c1c;
        }
        .add-member-select {
            padding: 4px 8px;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            width: 100%;
        }
        .sortable-header {
            cursor: pointer;
            user-select: none;
        }
        .sortable-header:hover {
            background-color: #e5e7eb;
        }
        .sort-icon {
            margin-left: 4px;
            font-size: 0.7rem;
        }
        .status-badge {
            padding: 0.15rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-block;
            transition: 0.1s ease;
        }
        .status-badge:active {
            transform: scale(0.94);
        }
        .status-aktif {
            background-color: #dcfce7;
            color: #15803d;
        }
        .status-tidak_aktif {
            background-color: #fee2e2;
            color: #b91c1c;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <div class="bg-white rounded-lg shadow-md p-4 md:p-6">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-3">
                <h1 class="text-xl md:text-2xl font-bold">Panel Admin</h1>
                <a href="#" onclick="logoutAdmin(); return false;" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 w-full sm:w-auto text-center"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
            <div class="border-b mb-6 overflow-x-auto">
                <ul class="flex flex-nowrap sm:flex-wrap -mb-px">
                    <li class="mr-2"><button class="tab-link inline-block p-2 sm:p-3 text-blue-600 border-b-2 border-blue-600 rounded-t-lg active" data-tab="murid">Data Murid</button></li>
                    <li class="mr-2"><button class="tab-link inline-block p-2 sm:p-3 hover:text-gray-600" data-tab="guru">Data Guru</button></li>
                    <li class="mr-2"><button class="tab-link inline-block p-2 sm:p-3 hover:text-gray-600" data-tab="mapel">Data Mapel</button></li>
                    <li class="mr-2"><button class="tab-link inline-block p-2 sm:p-3 hover:text-gray-600" data-tab="penugasan">Penugasan</button></li>
                    <li class="mr-2"><button class="tab-link inline-block p-2 sm:p-3 hover:text-gray-600" data-tab="riwayat">Riwayat Sesi Mengajar</button></li>
                </ul>
            </div>
            <div id="murid" class="tab-content">Loading Data Murid...</div>
            <div id="guru" class="tab-content hidden">Loading Data Guru...</div>
            <div id="mapel" class="tab-content hidden">Loading Data Mapel...</div>
            <div id="penugasan" class="tab-content hidden">Loading Penugasan...</div>
            <div id="riwayat" class="tab-content hidden">Loading Riwayat Sesi Mengajar...</div>
        </div>
    </div>

    <!-- MODAL EDIT PENUGASAN -->
    <div id="modalEditPenugasan" class="fixed inset-0 z-50 hidden items-center justify-center modal-bg no-print" style="background:rgba(0,0,0,0.5); backdrop-filter:blur(4px);">
        <div class="bg-white rounded-2xl max-w-2xl w-full mx-4 p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 class="text-lg font-bold mb-3"><i class="fas fa-edit text-indigo-500"></i> Edit Penugasan</h3>
            <div class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block font-semibold text-sm">Mata Pelajaran</label><p id="editMapelNama" class="text-gray-700 text-sm">-</p></div>
                    <div><label class="block font-semibold text-sm">Guru</label><p id="editGuruNama" class="text-gray-700 text-sm">-</p></div>
                </div>
                <div>
                    <label class="block font-semibold text-sm">Daftar Murid</label>
                    <div id="editMemberList" class="member-list border rounded p-2 bg-gray-50 min-h-[80px]">
                        <p class="text-gray-400 text-sm">Memuat...</p>
                    </div>
                </div>
                <div>
                    <label class="block font-semibold text-sm">Tambah Murid</label>
                    <div class="flex gap-2">
                        <select id="editAddMemberSelect" class="add-member-select flex-1">
                            <option value="">-- Pilih Murid --</option>
                        </select>
                        <button id="editAddMemberBtn" class="bg-green-600 text-white px-4 py-1 rounded text-sm hover:bg-green-700">Tambah</button>
                    </div>
                </div>
                <div class="flex justify-end gap-3 mt-4">
                    <button id="editBatalBtn" class="px-3 py-1.5 border rounded-lg text-sm">Tutup</button>
                    <button id="editSimpanBtn" class="px-3 py-1.5 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700">Simpan Perubahan</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== CEK LOGIN ADMIN =====
        if (!localStorage.getItem('adminLogin')) {
            window.location.href = 'index.html';
        }

        function logoutAdmin() {
            localStorage.removeItem('adminLogin');
            window.location.href = 'index.html';
        }

        // ===== KONFIGURASI FIREBASE =====
        const firebaseConfig = {
            apiKey: "AIzaSyAEUxtP2D26eF5zS2sgR5_bpzK6SNRwQA0",
            authDomain: "edulognbs.firebaseapp.com",
            databaseURL: "https://edulognbs-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "edulognbs",
            storageBucket: "edulognbs.firebasestorage.app",
            messagingSenderId: "759345868898",
            appId: "1:759345868898:web:40487df20ab4f43045213b",
            measurementId: "G-SV83KDGZTS"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // ===== FUNGSI GLOBAL =====
        function showError(msg) {
            console.error(msg);
            alert("Error: " + msg);
        }

        function parseDMY(dateStr) {
            if (!dateStr) return null;
            let parts = dateStr.split('/');
            if (parts.length === 3) {
                let d = parseInt(parts[0],10), m = parseInt(parts[1],10)-1, y = parseInt(parts[2],10);
                let date = new Date(y,m,d);
                if (!isNaN(date.getTime())) return date.getTime();
            }
            return null;
        }

        function formatDateToDMY(date) {
            let d = date.getDate().toString().padStart(2,'0');
            let m = (date.getMonth()+1).toString().padStart(2,'0');
            let y = date.getFullYear();
            return `${d}/${m}/${y}`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m] || m));
        }

        function attachCloseModal(modalEl) {
            const closeBtns = modalEl.querySelectorAll('.closeModalBtn');
            closeBtns.forEach(btn => {
                btn.onclick = () => modalEl.remove();
            });
            modalEl.addEventListener('click', (e) => {
                if (e.target === modalEl) modalEl.remove();
            });
        }

        // ===== TAB SWITCHING =====
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            document.querySelectorAll('.tab-link').forEach(btn => {
                btn.classList.remove('border-blue-600', 'text-blue-600');
                btn.classList.add('border-transparent', 'text-gray-500');
            });
            document.querySelector(`[data-tab="${tabId}"]`).classList.add('border-blue-600', 'text-blue-600');
            if (tabId === 'murid') loadMuridListView();
            else if (tabId === 'guru') loadGuru();
            else if (tabId === 'mapel') loadMapel();
            else if (tabId === 'penugasan') loadPenugasan();
            else if (tabId === 'riwayat') loadRiwayat();
        }

        document.querySelectorAll('.tab-link').forEach(btn => {
            btn.onclick = () => showTab(btn.dataset.tab);
        });

        // ============================================================
        // 1. DATA MURID (semua kode sama seperti sebelumnya, tidak diubah)
        // ============================================================
        // ... (fungsi hitungSemuaStatistikSiswa, loadMuridListView, openClassDetail, toggleStatus, renderClassDetail, showNilaiMuridModal, showRekapKehadiran) ...
        // Karena panjang, saya asumsikan sudah ada dan tidak diubah. Saya akan langsung menulis ulang bagian RIWAYAT.

        // ============================================================
        // 5. RIWAYAT SESI MENGAJAR (DIUBAH)
        // ============================================================
        let riwayatData = [];
        let riwayatSort = { key: 'tanggal', asc: false };

        async function loadRiwayat() {
            const container = document.getElementById('riwayat');
            container.innerHTML = `<div class="text-center py-8"><div class="loading-spinner mx-auto mb-2"></div><p>Memuat riwayat sesi mengajar...</p></div>`;
            try {
                const [attendanceSnap, penugasanSnap, mapelSnap, siswaSnap] = await Promise.all([
                    db.ref('attendance').once('value'),
                    db.ref('penugasan').once('value'),
                    db.ref('mapel').once('value'),
                    db.ref('siswa').once('value')
                ]);
                const attendance = attendanceSnap.val() || {};
                const penugasan = penugasanSnap.val() || {};
                const mapel = mapelSnap.val() || {};
                const siswaData = siswaSnap.val() || {};

                // Buat map status siswa
                const statusMap = {};
                for (let [nis, data] of Object.entries(siswaData)) {
                    statusMap[nis] = data.status || 'aktif';
                }

                const rows = [];
                for (let [penugasanId, pg] of Object.entries(penugasan)) {
                    const mapelData = mapel[pg.mapelId];
                    const namaMapel = mapelData?.nama || '❌ Mapel dihapus';
                    const jenisMapel = mapelData?.jenis || 'inkul';
                    const guruName = pg.guruName || '❌ Guru dihapus';

                    // Daftar siswa aktif di penugasan ini
                    const siswaList = pg.siswaList || [];
                    const siswaAktif = siswaList.filter(nis => statusMap[nis] !== 'tidak_aktif');
                    const totalSiswaAktif = siswaAktif.length;

                    let kelasSet = new Set();
                    if (jenisMapel === 'inkul' && siswaList.length) {
                        for (let nis of siswaList) {
                            if (siswaData[nis] && siswaData[nis].kelas) {
                                kelasSet.add(siswaData[nis].kelas);
                            }
                        }
                    }
                    const kelasDisplay = kelasSet.size ? Array.from(kelasSet).sort().join(', ') : '';

                    const sessions = attendance[penugasanId] || {};
                    for (let [sessionId, ses] of Object.entries(sessions)) {
                        // Hitung jumlah hadir dari siswa aktif
                        let jumlahHadir = 0;
                        for (let nis of siswaAktif) {
                            const status = ses.records?.[nis];
                            if (status === undefined || status === 'H') {
                                jumlahHadir++;
                            }
                        }
                        const persentase = totalSiswaAktif > 0 ? (jumlahHadir / totalSiswaAktif) * 100 : 0;
                        const persentaseBulat = Math.round(persentase * 10) / 10; // 1 desimal

                        rows.push({
                            tanggal: ses.date || '?',
                            tanggalTimestamp: parseDMY(ses.date) || 0,
                            guru: guruName,
                            mapel: namaMapel,
                            kelas: (jenisMapel === 'inkul') ? kelasDisplay : '',
                            topik: ses.topic || '-',
                            persentase: persentaseBulat,
                            penugasanId: penugasanId,
                            sessionId: sessionId
                        });
                    }
                }
                riwayatData = rows;
                renderRiwayatTable(container);
            } catch (err) {
                container.innerHTML = `<div class="text-red-500">Error: ${err.message}</div>`;
            }
        }

        function renderRiwayatTable(container) {
            if (!riwayatData.length) {
                container.innerHTML = `<div class="text-center py-8 text-gray-500"><i class="fas fa-info-circle text-3xl mb-2"></i><p>Belum ada sesi mengajar yang tercatat.</p></div>`;
                return;
            }

            // Sorting
            const sorted = [...riwayatData];
            const key = riwayatSort.key;
            const asc = riwayatSort.asc;
            sorted.sort((a, b) => {
                let valA = a[key] ?? '';
                let valB = b[key] ?? '';
                if (key === 'tanggalTimestamp') {
                    valA = a.tanggalTimestamp;
                    valB = b.tanggalTimestamp;
                } else if (key === 'persentase') {
                    valA = a.persentase;
                    valB = b.persentase;
                }
                if (typeof valA === 'string') valA = valA.toLowerCase();
                if (typeof valB === 'string') valB = valB.toLowerCase();
                if (valA < valB) return asc ? -1 : 1;
                if (valA > valB) return asc ? 1 : -1;
                return 0;
            });

            const headers = [
                { key: 'tanggal', label: 'Tanggal' },
                { key: 'guru', label: 'Nama Guru' },
                { key: 'mapel', label: 'Mata Pelajaran' },
                { key: 'kelas', label: 'Kelas' },
                { key: 'topik', label: 'Topik / Materi' },
                { key: 'persentase', label: '% Kehadiran Murid' }
            ];

            let html = `<div class="overflow-x-auto"><table class="min-w-full border text-sm"><thead class="bg-gray-100">`;
            html += `<tr>`;
            for (let h of headers) {
                const isActive = riwayatSort.key === h.key;
                const icon = isActive ? (riwayatSort.asc ? '▲' : '▼') : '⇅';
                html += `<th class="p-2 border sortable-header" data-key="${h.key}">${h.label} <span class="sort-icon">${icon}</span></th>`;
            }
            html += `</tr></thead><tbody>`;

            for (let row of sorted) {
                const persenDisplay = row.persentase.toFixed(1) + '%';
                html += `<tr>
                    <td class="p-2 border">${escapeHtml(row.tanggal)}</td>
                    <td class="p-2 border">${escapeHtml(row.guru)}</td>
                    <td class="p-2 border">${escapeHtml(row.mapel)}</td>
                    <td class="p-2 border">${escapeHtml(row.kelas)}</td>
                    <td class="p-2 border">${escapeHtml(row.topik)}</td>
                    <td class="p-2 border text-center font-bold">${persenDisplay}</td>
                </tr>`;
            }
            html += `</tbody></table></div>`;
            html += `<div class="mt-3 text-xs text-gray-500">Total sesi: ${sorted.length}</div>`;
            container.innerHTML = html;

            // Event listener untuk sorting
            container.querySelectorAll('.sortable-header').forEach(th => {
                th.addEventListener('click', () => {
                    const key = th.dataset.key;
                    if (riwayatSort.key === key) {
                        riwayatSort.asc = !riwayatSort.asc;
                    } else {
                        riwayatSort.key = key;
                        riwayatSort.asc = false;
                    }
                    renderRiwayatTable(container);
                });
            });
        }

        // ============================================================
        // Fungsi lain (DATA GURU, MAPEL, PENUGASAN) tetap sama seperti sebelumnya
        // ============================================================
        // ... (loadGuru, loadMapel, loadPenugasan) ...
        // Karena sudah ada di kode sebelumnya dan tidak diubah, saya tidak tulis ulang di sini.

        // ============================================================
        // INITIAL LOAD
        // ============================================================
        loadMuridListView();
        loadGuru();
        loadMapel();
        loadPenugasan();
    </script>
</body>
</html>
