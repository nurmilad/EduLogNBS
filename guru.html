    const db = firebase.database();

    let currentTeacher = null;

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
    function toYMD(date) { return date.toISOString().slice(0,10); }
    function toDMY(ymd) { if (!ymd) return ''; let [y,m,d] = ymd.split('-'); return `${d}/${m}/${y}`; }
    function formatDateToDMY(date) { return toDMY(toYMD(date)); }
    function parseDMY(dateStr) { if(!dateStr) return null; let parts = dateStr.split('/'); if(parts.length===3){ let d=parseInt(parts[0]), m=parseInt(parts[1])-1, y=parseInt(parts[2]); return new Date(y,m,d); } return null; }

    // === FUNGSI HAPUS PENUGASAN ===
    async function deleteAssignment(penugasanId) {
        if (!confirm("Yakin ingin menghapus penugasan ini? Semua data kehadiran, penilaian, dan catatan akan ikut terhapus.")) return;
        try {
            await db.ref(`attendance/${penugasanId}`).remove();
            await db.ref(`penilaian/${penugasanId}`).remove();
            await db.ref(`catatan/${penugasanId}`).remove();
            await db.ref(`penugasan/${penugasanId}`).remove();
            alert("Penugasan berhasil dihapus.");
            await fetchInitialData();
            await renderAllCards();
        } catch (err) {
            alert("Gagal menghapus penugasan: " + err.message);
        }
    }

    async function fetchInitialData() {
        try {
            const [mapelSnap, kelasSnap, siswaSnap, penugasanSnap] = await Promise.all([
                db.ref('mapel').once('value'),
                db.ref('kelas').once('value'),
                db.ref('siswa').once('value'),
                db.ref('penugasan').once('value')
            ]);
            allMapel = mapelSnap.val() || {};
            allKelas = Object.keys(kelasSnap.val() || {});
            const siswaData = siswaSnap.val() || {};
            allSiswa = {};
            for (let [nis, data] of Object.entries(siswaData)) {
                allSiswa[nis] = {
                    nama: data.nama || '?',
                    kelas: data.kelas || '-',
                    status: data.status || 'aktif'
                };
            }
            const allPenugasan = penugasanSnap.val() || {};
            penugasanList = [];
            for (let [id, pg] of Object.entries(allPenugasan)) {
                if (pg.guruName === currentTeacher) {
                    const mapelData = allMapel[pg.mapelId] || { nama: 'Mapel Dihapus', jenis: 'inkul' };
                    const kelasSet = new Set();
                    for (let nis of (pg.siswaList || [])) {
                        if (allSiswa[nis]) kelasSet.add(allSiswa[nis].kelas);
                    }
                    penugasanList.push({
                        id, mapelId: pg.mapelId, guruName: pg.guruName, siswaList: pg.siswaList || [],
                        mapelNama: mapelData.nama, mapelJenis: mapelData.jenis,
                        kelasDisplay: kelasSet.size ? Array.from(kelasSet).join(', ') : 'Tanpa Kelas'
                    });
                }
            }
        } catch(e) { console.error(e); alert('Gagal muat data: '+e.message); }
    }

    async function renderAllCards() {
        const container = document.getElementById('assignmentsContainer');
        if (!penugasanList.length) {
            container.innerHTML = `<div class="col-span-full bg-white rounded-2xl shadow p-6 text-center"><i class="fas fa-folder-open text-3xl text-gray-300 mb-2"></i><p class="text-gray-500 text-sm">Belum ada penugasan. Klik "+ Penugasan" untuk memulai.</p></div>`;
            return;
        }
        let html = '';
        for (let task of penugasanList) {
            let inactiveCount = 0;
            for (let nis of task.siswaList) {
                if (allSiswa[nis] && allSiswa[nis].status === 'tidak_aktif') inactiveCount++;
            }
            const inactiveBadge = inactiveCount > 0 ? `<span class="ml-2 text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded-full">${inactiveCount} tidak aktif</span>` : '';
            html += `
                <div class="card-assignment p-3 cursor-pointer hover:shadow-lg transition" data-id="${task.id}">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-bold text-md text-indigo-800">${escapeHtml(task.mapelNama)} ${inactiveBadge}</h3>
                            <p class="text-xs text-gray-500 mt-0.5"><i class="fas fa-users"></i> Kelas: ${escapeHtml(task.kelasDisplay)}</p>
                            <p class="text-xs text-gray-400 mt-0.5">${task.mapelJenis === 'inkul' ? 'Intrakurikuler' : (task.mapelJenis === 'eskul' ? 'Ekskul' : 'Pesantren')}</p>
                        </div>
                        <i class="fas fa-chevron-right text-indigo-400 text-md"></i>
                    </div>
                    <button class="btn-delete-card" data-id="${task.id}" title="Hapus penugasan"><i class="fas fa-trash-alt"></i></button>
                </div>
            `;
        }
        container.innerHTML = html;

        container.querySelectorAll('.card-assignment').forEach(card => {
            card.addEventListener('click', (e) => {
                if (e.target.closest('.btn-delete-card')) return;
                const selectedTask = penugasanList.find(t => t.id === card.dataset.id);
                if (selectedTask) showDetailAssignment(selectedTask);
            });
        });

        container.querySelectorAll('.btn-delete-card').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const id = btn.dataset.id;
                await deleteAssignment(id);
            });
        });
    }

    function showDetailAssignment(task) {
        document.getElementById('assignmentsContainer').classList.add('hidden');
        document.getElementById('detailContainer').classList.remove('hidden');
        document.getElementById('detailTitle').innerHTML = `<i class="fas fa-book-open mr-1"></i> ${escapeHtml(task.mapelNama)} · ${escapeHtml(task.kelasDisplay)}`;
        
        const printContainer = document.getElementById('printButtonsContainer');
        printContainer.innerHTML = `
            <button class="btn-print" id="printAttendanceBtn"><i class="fas fa-print"></i> Hadir</button>
            <button class="btn-print" id="printGradesBtn"><i class="fas fa-print"></i> Nilai</button>
        `;
        document.getElementById('printAttendanceBtn').onclick = () => printAttendance(task);
        document.getElementById('printGradesBtn').onclick = () => printGrades(task);
        
        loadDetailTabs(task);
    }

    // ========== LOAD DETAIL TABS ==========
    async function loadDetailTabs(task) {
        const container = document.getElementById('detailContent');
        container.innerHTML = `
            <div class="flex gap-1 border-b mb-2 overflow-x-auto no-print">
                <button class="tab-kehadiran-btn py-1 px-3 rounded-t-lg text-sm font-semibold bg-indigo-600 text-white shadow">📋 Kehadiran</button>
                <button class="tab-penilaian-btn py-1 px-3 rounded-t-lg text-sm font-semibold text-gray-600 bg-gray-100">📝 Penilaian</button>
                <button class="tab-catatan-btn py-1 px-3 rounded-t-lg text-sm font-semibold text-gray-600 bg-gray-100">📌 Catatan</button>
            </div>
            <div class="tab-pane-kehadiran w-full"></div>
            <div class="tab-pane-penilaian hidden w-full"></div>
            <div class="tab-pane-catatan hidden w-full"></div>
        `;
        const kehadiranPane = container.querySelector('.tab-pane-kehadiran');
        const penilaianPane = container.querySelector('.tab-pane-penilaian');
        const catatanPane = container.querySelector('.tab-pane-catatan');
        const btnKehadiran = container.querySelector('.tab-kehadiran-btn');
        const btnPenilaian = container.querySelector('.tab-penilaian-btn');
        const btnCatatan = container.querySelector('.tab-catatan-btn');

        const activateTab = (pane, btn) => {
            [kehadiranPane, penilaianPane, catatanPane].forEach(p => p.classList.add('hidden'));
            [btnKehadiran, btnPenilaian, btnCatatan].forEach(b => {
                b.classList.remove('bg-indigo-600', 'text-white');
                b.classList.add('bg-gray-100', 'text-gray-600');
            });
            pane.classList.remove('hidden');
            btn.classList.add('bg-indigo-600', 'text-white');
            btn.classList.remove('bg-gray-100', 'text-gray-600');
        };

        btnKehadiran.onclick = () => {
            activateTab(kehadiranPane, btnKehadiran);
            renderKehadiranTab(kehadiranPane, task);
        };
        btnPenilaian.onclick = () => {
            activateTab(penilaianPane, btnPenilaian);
            renderPenilaianTab(penilaianPane, task);
        };
        btnCatatan.onclick = () => {
            activateTab(catatanPane, btnCatatan);
            renderCatatanTab(catatanPane, task);
        };

        renderKehadiranTab(kehadiranPane, task);
    }

    async function refreshWithScroll(wrapperElement, refreshFn, ...args) {
        if (!wrapperElement) { await refreshFn(...args); return; }
        const oldLeft = wrapperElement.scrollLeft;
        const oldTop = wrapperElement.scrollTop;
        await refreshFn(...args);
        wrapperElement.scrollLeft = oldLeft;
        wrapperElement.scrollTop = oldTop;
    }

    async function deleteAttendanceSession(assignmentId, sessionId) {
        if (!confirm("Hapus sesi kehadiran ini? Seluruh data status kehadiran akan hilang.")) return;
        await db.ref(`attendance/${assignmentId}/${sessionId}`).remove();
    }

    async function refreshKehadiranTable(container, task) {
        const wrapperDiv = container.querySelector('#kehadiranTableWrapper');
        if (!wrapperDiv) return;
        const sessionsSnap = await db.ref(`attendance/${task.id}`).once('value');
        const sessions = sessionsSnap.val() || {};
        let sessionsList = Object.entries(sessions).map(([sid, val]) => ({ id: sid, date: val.date, topic: val.topic || '', records: val.records || {} }));
        sessionsList.sort((a,b) => (parseDMY(a.date)||0) - (parseDMY(b.date)||0));
        
        const siswaArray = task.siswaList.map(nis => {
            const data = allSiswa[nis] || { nama: '?', status: 'aktif' };
            return { nis, nama: data.nama, status: data.status };
        }).filter(s => s.nama !== '?');
        
        let html = `<table class="sticky-table">`;
        html += `<thead><tr>
                    <th class="sticky-col-first">NIS</th>
                    <th class="sticky-col-second">Nama</th>`;
        for (let ses of sessionsList) {
            let shortDate = ses.date.split('/').slice(0,2).join('/');
            html += `<th class="text-center whitespace-nowrap">
                        <div>${escapeHtml(shortDate)}</div>
                        <div class="text-xs text-gray-400 font-light">${escapeHtml(ses.topic.length > 12 ? ses.topic.substring(0,12)+'…' : ses.topic)}</div>
                        <div class="flex items-center justify-center gap-0.5 mt-0.5">
                            <button class="icon-btn icon-edit edit-session" data-session-id="${ses.id}" data-current-date="${ses.date}" data-current-topic="${ses.topic}"><i class="fas fa-pen fa-xs"></i></button>
                            <button class="icon-btn icon-delete delete-session" data-session-id="${ses.id}"><i class="fas fa-trash-alt fa-xs"></i></button>
                        </div>
                     </th>`;
        }
        html += `<th class="bg-gray-50 text-center">Jml H</th>`;
        html += `</tr></thead><tbody>`;
        
        for (let siswa of siswaArray) {
            let hadirCount = 0;
            const isTidakAktif = (siswa.status === 'tidak_aktif');
            const rowClass = isTidakAktif ? 'siswa-tidak-aktif' : '';
            html += `<tr>
                        <td class="sticky-col-first ${rowClass}">${escapeHtml(siswa.nis)}</td>
                        <td class="sticky-col-second ${rowClass}">${escapeHtml(siswa.nama)}</td>`;
            for (let ses of sessionsList) {
                let status = ses.records[siswa.nis] || 'H';
                if (status === 'H') hadirCount++;
                let statusClass = '';
                if (status === 'H') statusClass = 'status-h';
                else if (status === 'I') statusClass = 'status-i';
                else if (status === 'S') statusClass = 'status-s';
                else if (status === 'A') statusClass = 'status-a';
                html += `<td class="text-center">
                            <div class="status-badge ${statusClass} kehadiran-status" data-session="${ses.id}" data-nis="${siswa.nis}" data-status="${status}">${status}</div>
                           </td>`;
            }
            html += `<td class="font-bold text-center text-sm">${hadirCount}</td>`;
            html += `</tr>`;
        }
        html += `</tbody></table>`;
        wrapperDiv.innerHTML = html;
        
        wrapperDiv.querySelectorAll('.edit-session').forEach(btn => {
            btn.onclick = (e) => {
                e.stopPropagation();
                openEditSesiModal(task.id, btn.dataset.sessionId, btn.dataset.currentDate, btn.dataset.currentTopic, () => refreshWithScroll(wrapperDiv, refreshKehadiranTable, container, task));
            };
        });
        wrapperDiv.querySelectorAll('.delete-session').forEach(btn => {
            btn.onclick = async (e) => {
                e.stopPropagation();
                await deleteAttendanceSession(task.id, btn.dataset.sessionId);
                await refreshWithScroll(wrapperDiv, refreshKehadiranTable, container, task);
            };
        });
        wrapperDiv.querySelectorAll('.kehadiran-status').forEach(badge => {
            badge.onclick = async (e) => {
                e.stopPropagation();
                const sessionId = badge.dataset.session;
                const nis = badge.dataset.nis;
                const currentStatus = badge.dataset.status;
                const statusCycle = { 'H': 'I', 'I': 'S', 'S': 'A', 'A': 'H' };
                const newStatus = statusCycle[currentStatus] || 'H';
                await db.ref(`attendance/${task.id}/${sessionId}/records/${nis}`).set(newStatus);
                await refreshWithScroll(wrapperDiv, refreshKehadiranTable, container, task);
            };
        });
    }

    async function openEditSesiModal(assignmentId, sessionId, oldDateDMY, oldTopic, callback) {
        let oldDate = parseDMY(oldDateDMY);
        let ymd = oldDate ? toYMD(oldDate) : '';
        const modal = document.getElementById('modalEditSesi');
        document.getElementById('editSesiTanggal').value = ymd;
        document.getElementById('editSesiTopik').value = oldTopic || '';
        modal.style.display = 'flex';
        
        const saveBtn = document.getElementById('saveEditSesi');
        const cancelBtn = document.getElementById('cancelEditSesi');
        
        const onSave = async () => {
            let newYmd = document.getElementById('editSesiTanggal').value;
            if (!newYmd) { alert("Pilih tanggal"); return; }
            let newDateDMY = formatDateToDMY(new Date(newYmd));
            let newTopic = document.getElementById('editSesiTopik').value.trim() || '';
            await db.ref(`attendance/${assignmentId}/${sessionId}`).update({
                date: newDateDMY,
                topic: newTopic
            });
            modal.style.display = 'none';
            if (callback) callback();
            cleanup();
        };
        const onCancel = () => { modal.style.display = 'none'; cleanup(); };
        const cleanup = () => { saveBtn.removeEventListener('click', onSave); cancelBtn.removeEventListener('click', onCancel); };
        saveBtn.addEventListener('click', onSave);
        cancelBtn.addEventListener('click', onCancel);
    }

    async function openAddKehadiranModal(task) {
        const todayYMD = toYMD(new Date());
        document.getElementById('kehadiranDate').value = todayYMD;
        document.getElementById('kehadiranTopik').value = '';
        const modal = document.getElementById('modalTambahKehadiran');
        modal.style.display = 'flex';
        const simpan = document.getElementById('simpanKehadiran');
        const batal = document.getElementById('batalKehadiran');
        const onSimpan = async () => {
            let ymd = document.getElementById('kehadiranDate').value;
            if (!ymd) { alert("Pilih tanggal"); return; }
            let topik = document.getElementById('kehadiranTopik').value.trim();
            if (!topik) { alert("Masukkan topik / materi"); return; }
            let dateDMY = formatDateToDMY(new Date(ymd));
            const newSessionId = Date.now().toString();
            await db.ref(`attendance/${task.id}/${newSessionId}`).set({
                date: dateDMY,
                topic: topik,
                records: {}
            });
            modal.style.display = 'none';
            const container = document.querySelector('#detailContent .tab-pane-kehadiran');
            if (container) {
                const wrap = container.querySelector('#kehadiranTableWrapper');
                if(wrap) await refreshWithScroll(wrap, refreshKehadiranTable, container, task);
                else await refreshKehadiranTable(container, task);
            }
            cleanup();
        };
        const cleanup = () => { simpan.removeEventListener('click', onSimpan); batal.removeEventListener('click', closeModal); };
        const closeModal = () => { modal.style.display = 'none'; cleanup(); };
        simpan.addEventListener('click', onSimpan);
        batal.addEventListener('click', closeModal);
    }

    async function deleteAssessment(assignmentId, assessId) {
        if (!confirm("Hapus kolom penilaian ini? Semua nilai siswa untuk penilaian ini akan hilang.")) return;
        await db.ref(`penilaian/${assignmentId}/${assessId}`).remove();
    }

    async function refreshPenilaianTable(container, task) {
        const wrapperDiv = container.querySelector('#penilaianTableWrapper');
        if (!wrapperDiv) return;
        
        const assessmentsSnap = await db.ref(`penilaian/${task.id}`).once('value');
        const assessments = assessmentsSnap.val() || {};
        let assessList = Object.entries(assessments).map(([id, val]) => ({ id, date: val.date, topic: val.topic, scores: val.scores || {} }));
        assessList.sort((a,b) => (parseDMY(a.date)||0) - (parseDMY(b.date)||0));
        
        const siswaArray = task.siswaList.map(nis => {
            const data = allSiswa[nis] || { nama: '?', status: 'aktif' };
            return { nis, nama: data.nama, status: data.status };
        }).filter(s => s.nama !== '?');
        
        if (assessList.length === 0) {
            wrapperDiv.innerHTML = `<div class="text-center py-8 text-gray-400"><i class="fas fa-clipboard-list text-2xl mb-2"></i><p class="text-sm">Belum ada data penilaian</p><p class="text-xs">Klik tombol + untuk menambah penilaian</p></div>`;
            return;
        }
        
        let html = `<table class="sticky-table penilaian-table">`;
        html += `<thead>`;
        html += `<tr>
                    <th rowspan="2" class="sticky-col-first">NIS</th>
                    <th rowspan="2" class="sticky-col-second">Nama</th>`;
        for (let i = 0; i < assessList.length; i++) {
            html += `<th class="text-center">
                        <div><strong>N${i+1}</strong></div>
                        <div class="flex items-center justify-center gap-0.5 mt-0.5">
                            <button class="icon-btn icon-edit edit-assessment" data-assess-id="${assessList[i].id}"><i class="fas fa-pen fa-xs"></i></button>
                            <button class="icon-btn icon-delete delete-assessment" data-assess-id="${assessList[i].id}"><i class="fas fa-trash-alt fa-xs"></i></button>
                        </div>
                     </th>`;
        }
        html += `<th rowspan="2" class="bg-gray-50">Rata</th>`;
        html += `</tr>`;
        html += `<tr>`;
        for (let as of assessList) {
            html += `<th class="text-center text-xs font-normal bg-gray-50">
                        <div>${escapeHtml(as.date)}</div>
                        <div class="text-gray-500 text-xs">${escapeHtml(as.topic ? as.topic.substring(0,10) : '-')}</div>
                     </th>`;
        }
        html += `</tr>`;
        html += `</thead><tbody>`;
        
        for (let siswa of siswaArray) {
            let totalNilai = 0;
            let countValid = 0;
            const isTidakAktif = (siswa.status === 'tidak_aktif');
            const rowClass = isTidakAktif ? 'siswa-tidak-aktif' : '';
            html += `<tr>
                        <td class="sticky-col-first ${rowClass}">${escapeHtml(siswa.nis)}</td>
                        <td class="sticky-col-second ${rowClass}">${escapeHtml(siswa.nama)}</td>`;
            for (let as of assessList) {
                let nilai = as.scores[siswa.nis] !== undefined ? as.scores[siswa.nis] : 0;
                if (nilai > 0) { totalNilai += nilai; countValid++; }
                html += `<td class="text-center">
                            <input type="number" class="nilai-input nilai-siswa" data-assess="${as.id}" data-nis="${siswa.nis}" value="${nilai}" step="1" min="0" max="100">
                            </td>`;
            }
            let rata = assessList.length ? (totalNilai / assessList.length).toFixed(1) : 0;
            html += `<td class="font-bold text-center bg-gray-50 text-sm">${rata}</td>`;
            html += `</tr>`;
        }
        html += `</tbody></table>`;
        wrapperDiv.innerHTML = html;
        
        wrapperDiv.querySelectorAll('.edit-assessment').forEach(btn => {
            btn.onclick = async (e) => {
                e.stopPropagation();
                const assessId = btn.dataset.assessId;
                const assessment = assessList.find(a => a.id === assessId);
                if (assessment) {
                    let oldYMD = assessment.date?.split('/').reverse().join('-') || '';
                    let newDate = prompt("Edit Tanggal (yyyy-mm-dd):", oldYMD);
                    if (newDate) {
                        let newDateObj = new Date(newDate);
                        if (!isNaN(newDateObj)) {
                            let newDateDMY = formatDateToDMY(newDateObj);
                            let newTopic = prompt("Edit Topik:", assessment.topic);
                            if (newTopic !== null) {
                                await db.ref(`penilaian/${task.id}/${assessId}/date`).set(newDateDMY);
                                await db.ref(`penilaian/${task.id}/${assessId}/topic`).set(newTopic || "Penilaian");
                                await refreshWithScroll(wrapperDiv, refreshPenilaianTable, container, task);
                            }
                        } else {
                            alert("Format tanggal salah!");
                        }
                    }
                }
            };
        });
        
        wrapperDiv.querySelectorAll('.delete-assessment').forEach(btn => {
            btn.onclick = async (e) => {
                e.stopPropagation();
                await deleteAssessment(task.id, btn.dataset.assessId);
                await refreshWithScroll(wrapperDiv, refreshPenilaianTable, container, task);
            };
        });
        
        wrapperDiv.querySelectorAll('.nilai-siswa').forEach(inp => {
            inp.onchange = async () => {
                let val = parseInt(inp.value, 10);
                if (isNaN(val)) val = 0;
                val = Math.min(100, Math.max(0, val));
                inp.value = val;
                await db.ref(`penilaian/${task.id}/${inp.dataset.assess}/scores/${inp.dataset.nis}`).set(val);
                await refreshWithScroll(wrapperDiv, refreshPenilaianTable, container, task);
            };
        });
    }

    // ================= CATATAN =================
    let catatanFilterJenis = 'semua';
    let catatanSort = { key: 'tanggal', asc: false };
    let currentEditTask = null;

    async function renderCatatanTab(container, task) {
        container.innerHTML = `
            <div class="flex flex-wrap justify-between items-center gap-2 mb-2 no-print">
                <div class="flex items-center gap-2">
                    <button class="btn-plus btn-add-catatan" title="Tambah catatan"><i class="fas fa-plus"></i></button>
                    <select id="filterJenisCatatan" class="filter-dropdown">
                        <option value="semua">Semua</option>
                        <option value="positif">Positif</option>
                        <option value="negatif">Negatif</option>
                    </select>
                </div>
                <span class="text-xs text-gray-500" id="jumlahCatatan">0 catatan</span>
            </div>
            <div id="catatanTableWrapper" class="table-scroll-wrapper"><div class="text-center py-6 text-sm">Memuat data...</div></div>
        `;
        container.querySelector('.btn-add-catatan').onclick = () => openAddCatatanModal(task);
        document.getElementById('filterJenisCatatan').addEventListener('change', () => {
            catatanFilterJenis = document.getElementById('filterJenisCatatan').value;
            refreshCatatanTable(container, task);
        });
        await refreshCatatanTable(container, task);
    }

    async function refreshCatatanTable(container, task) {
        const wrapperDiv = container.querySelector('#catatanTableWrapper');
        if (!wrapperDiv) return;
        const snap = await db.ref(`catatan/${task.id}`).once('value');
        const data = snap.val() || {};
        let catatanList = Object.entries(data).map(([id, val]) => ({
            id,
            tanggal: val.tanggal || '',
            nis: val.nis || '',
            nama: val.nama || (allSiswa[val.nis] ? allSiswa[val.nis].nama : '?'),
            jenis: val.jenis || 'positif',
            keterangan: val.keterangan || '',
            nilai: val.nilai || ''
        }));

        if (catatanFilterJenis !== 'semua') {
            catatanList = catatanList.filter(c => c.jenis === catatanFilterJenis);
        }

        const key = catatanSort.key;
        const asc = catatanSort.asc;
        catatanList.sort((a, b) => {
            let valA = a[key] ?? '';
            let valB = b[key] ?? '';
            if (typeof valA === 'string') valA = valA.toLowerCase();
            if (typeof valB === 'string') valB = valB.toLowerCase();
            if (valA < valB) return asc ? -1 : 1;
            if (valA > valB) return asc ? 1 : -1;
            return 0;
        });

        const jumlah = document.getElementById('jumlahCatatan');
        if (jumlah) jumlah.textContent = catatanList.length + ' catatan';

        if (catatanList.length === 0) {
            wrapperDiv.innerHTML = `<div class="text-center py-8 text-gray-400"><i class="fas fa-sticky-note text-2xl mb-2"></i><p class="text-sm">Belum ada catatan</p><p class="text-xs">Klik tombol + untuk menambah catatan</p></div>`;
            return;
        }

        let html = `<table class="sticky-table catatan-table">`;
        html += `<thead><tr>
            <th class="sortable-header col-tanggal" data-key="tanggal">Tanggal</th>
            <th class="sortable-header col-nis" data-key="nis">NIS</th>
            <th class="sortable-header col-nama" data-key="nama">Nama</th>
            <th class="sortable-header col-jenis" data-key="jenis">Positif/Negatif</th>
            <th class="sortable-header col-keterangan" data-key="keterangan">Keterangan</th>
            <th class="sortable-header col-nilai" data-key="nilai">Nilai / Deskripsi</th>
            <th class="col-aksi">Aksi</th>
        </tr></thead><tbody>`;

        for (let c of catatanList) {
            let tanggalDisplay = c.tanggal || '-';
            if (c.tanggal && c.tanggal.length === 10) {
                const parts = c.tanggal.split('-');
                tanggalDisplay = `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
            const jenisLabel = c.jenis === 'positif' ? '✅ Positif' : '❌ Negatif';
            const jenisColor = c.jenis === 'positif' ? 'text-green-700' : 'text-red-700';
            html += `<tr>
                <td class="col-tanggal">${escapeHtml(tanggalDisplay)}</td>
                <td class="col-nis">${escapeHtml(c.nis)}</td>
                <td class="col-nama">${escapeHtml(c.nama)}</td>
                <td class="col-jenis ${jenisColor} font-semibold">${escapeHtml(jenisLabel)}</td>
                <td class="col-keterangan">${escapeHtml(c.keterangan)}</td>
                <td class="col-nilai">${escapeHtml(c.nilai)}</td>
                <td class="col-aksi text-center">
                    <button class="icon-btn icon-edit-green edit-catatan" data-id="${c.id}" data-task-id="${task.id}" title="Edit catatan"><i class="fas fa-pen"></i></button>
                    <button class="icon-btn icon-delete delete-catatan" data-id="${c.id}" title="Hapus catatan"><i class="fas fa-trash-alt"></i></button>
                </td>
            </tr>`;
        }
        html += `</tbody></table>`;
        wrapperDiv.innerHTML = html;

        // Sort
        wrapperDiv.querySelectorAll('.sortable-header').forEach(th => {
            th.addEventListener('click', () => {
                const key = th.dataset.key;
                if (catatanSort.key === key) catatanSort.asc = !catatanSort.asc;
                else { catatanSort.key = key; catatanSort.asc = true; }
                refreshCatatanTable(container, task);
            });
        });

        // Delete
        wrapperDiv.querySelectorAll('.delete-catatan').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const id = btn.dataset.id;
                if (!confirm("Hapus catatan ini?")) return;
                await db.ref(`catatan/${task.id}/${id}`).remove();
                refreshCatatanTable(container, task);
            });
        });

        // Edit
        wrapperDiv.querySelectorAll('.edit-catatan').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = btn.dataset.id;
                const catatan = catatanList.find(c => c.id === id);
                if (catatan) {
                    openEditCatatanModal(task, catatan);
                }
            });
        });
    }

    // ===== MODAL TAMBAH CATATAN =====
    async function openAddCatatanModal(task) {
        const modal = document.getElementById('modalTambahCatatan');
        const today = toYMD(new Date());
        document.getElementById('catatanTanggal').value = today;

        const selectSiswa = document.getElementById('catatanSiswaSelect');
        selectSiswa.innerHTML = '<option value="">-- Pilih Siswa --</option>';
        const siswaList = task.siswaList.map(nis => ({ nis, nama: allSiswa[nis]?.nama || '?' }))
            .filter(s => s.nama !== '?')
            .sort((a,b) => a.nama.localeCompare(b.nama));
        for (let s of siswaList) {
            const opt = document.createElement('option');
            opt.value = s.nis;
            opt.textContent = `${s.nis} - ${s.nama}`;
            selectSiswa.appendChild(opt);
        }
        document.getElementById('catatanJenis').value = 'positif';
        document.getElementById('catatanKeterangan').value = '';
        document.getElementById('catatanNilai').value = '';
        modal.style.display = 'flex';

        const simpan = document.getElementById('simpanCatatan');
        const batal = document.getElementById('batalCatatan');

        const onSimpan = async () => {
            const tanggal = document.getElementById('catatanTanggal').value;
            if (!tanggal) { alert("Pilih tanggal"); return; }
            const nis = selectSiswa.value;
            if (!nis) { alert("Pilih siswa"); return; }
            const jenis = document.getElementById('catatanJenis').value;
            const keterangan = document.getElementById('catatanKeterangan').value.trim();
            const nilai = document.getElementById('catatanNilai').value.trim();
            if (!keterangan && !nilai) { alert("Isi keterangan atau nilai"); return; }
            const nama = allSiswa[nis]?.nama || '?';
            const newId = Date.now().toString();
            await db.ref(`catatan/${task.id}/${newId}`).set({
                tanggal,
                nis,
                nama,
                jenis,
                keterangan,
                nilai
            });
            modal.style.display = 'none';
            const container = document.querySelector('#detailContent .tab-pane-catatan');
            if (container) await refreshCatatanTable(container, task);
            cleanup();
        };
        const onBatal = () => { modal.style.display = 'none'; cleanup(); };
        const cleanup = () => { simpan.removeEventListener('click', onSimpan); batal.removeEventListener('click', onBatal); };
        simpan.addEventListener('click', onSimpan);
        batal.addEventListener('click', onBatal);
    }

    // ===== MODAL EDIT CATATAN =====
    async function openEditCatatanModal(task, catatan) {
        const modal = document.getElementById('modalEditCatatan');
        currentEditTask = task;
        document.getElementById('editCatatanTanggal').value = catatan.tanggal || '';
        const selectSiswa = document.getElementById('editCatatanSiswaSelect');
        selectSiswa.innerHTML = '<option value="">-- Pilih Siswa --</option>';
        const siswaList = task.siswaList.map(nis => ({ nis, nama: allSiswa[nis]?.nama || '?' }))
            .filter(s => s.nama !== '?')
            .sort((a,b) => a.nama.localeCompare(b.nama));
        for (let s of siswaList) {
            const opt = document.createElement('option');
            opt.value = s.nis;
            opt.textContent = `${s.nis} - ${s.nama}`;
            selectSiswa.appendChild(opt);
        }
        selectSiswa.value = catatan.nis;
        document.getElementById('editCatatanJenis').value = catatan.jenis || 'positif';
        document.getElementById('editCatatanKeterangan').value = catatan.keterangan || '';
        document.getElementById('editCatatanNilai').value = catatan.nilai || '';
        modal.style.display = 'flex';

        const simpan = document.getElementById('simpanEditCatatan');
        const batal = document.getElementById('batalEditCatatan');

        const onSimpan = async () => {
            const tanggal = document.getElementById('editCatatanTanggal').value;
            if (!tanggal) { alert("Pilih tanggal"); return; }
            const nis = selectSiswa.value;
            if (!nis) { alert("Pilih siswa"); return; }
            const jenis = document.getElementById('editCatatanJenis').value;
            const keterangan = document.getElementById('editCatatanKeterangan').value.trim();
            const nilai = document.getElementById('editCatatanNilai').value.trim();
            if (!keterangan && !nilai) { alert("Isi keterangan atau nilai"); return; }
            const nama = allSiswa[nis]?.nama || '?';
            await db.ref(`catatan/${task.id}/${catatan.id}`).update({
                tanggal,
                nis,
                nama,
                jenis,
                keterangan,
                nilai
            });
            modal.style.display = 'none';
            const container = document.querySelector('#detailContent .tab-pane-catatan');
            if (container) await refreshCatatanTable(container, task);
            cleanup();
        };
        const onBatal = () => { modal.style.display = 'none'; cleanup(); };
        const cleanup = () => { simpan.removeEventListener('click', onSimpan); batal.removeEventListener('click', onBatal); };
        simpan.addEventListener('click', onSimpan);
        batal.addEventListener('click', onBatal);
    }

    // ========== FUNGSI CETAK ==========
    async function printAttendance(task) {
        const sessionsSnap = await db.ref(`attendance/${task.id}`).once('value');
        const sessions = sessionsSnap.val() || {};
        let sessionsList = Object.entries(sessions).map(([sid, val]) => ({ id: sid, date: val.date, topic: val.topic || '', records: val.records || {} }));
        sessionsList.sort((a,b) => (parseDMY(a.date)||0) - (parseDMY(b.date)||0));
        
        const siswaArray = task.siswaList.map(nis => {
            const data = allSiswa[nis] || { nama: '?', status: 'aktif' };
            return { nis, nama: data.nama, status: data.status };
        }).filter(s => s.nama !== '?');
        
        let printHtml = `
            <div class="print-area">
                <div class="print-header">
                    <h1 style="font-size: 22px;">LAPORAN DAFTAR HADIR</h1>
                    <h2>${escapeHtml(task.mapelNama)}</h2>
                    <p>Kelas: ${escapeHtml(task.kelasDisplay)}</p>
                    <p>Guru: ${escapeHtml(currentTeacher)}</p>
                    <p>Tanggal Cetak: ${new Date().toLocaleDateString('id-ID')}</p>
                </div>
                <table class="print-table">
                    <thead>
                        <tr><th>No</th><th>NIS</th><th>Nama</th>`;
        for (let ses of sessionsList) {
            printHtml += `<th>${escapeHtml(ses.date)}<br><span style="font-weight:normal;font-size:8pt;">${escapeHtml(ses.topic)}</span></th>`;
        }
        printHtml += `<th>Total H</th></tr>
                    </thead>
                    <tbody>`;
        
        let no = 1;
        for (let siswa of siswaArray) {
            let hadirCount = 0;
            const isTidakAktif = (siswa.status === 'tidak_aktif');
            const styleNama = isTidakAktif ? 'color:#dc2626;font-weight:600;' : '';
            printHtml += `<tr>
                            <td>${no++}</td>
                            <td>${escapeHtml(siswa.nis)}</td>
                            <td style="text-align:left;${styleNama}">${escapeHtml(siswa.nama)}</td>`;
            for (let ses of sessionsList) {
                let status = ses.records[siswa.nis] || 'H';
                if (status === 'H') hadirCount++;
                printHtml += `<td>${status}</td>`;
            }
            printHtml += `<td><strong>${hadirCount}</strong></td>
                        </tr>`;
        }
        printHtml += `
                    </tbody>
                </table>
                <div class="print-footer">
                    <p>Mengetahui,</p>
                    <p style="margin-top: 40px;">(_____________________)</p>
                </div>
            </div>`;
        
        const printWindow = window.open('', '_blank');
        printWindow.document.write(`
            <html>
            <head>
                <title>Daftar Hadir - ${task.mapelNama}</title>
                <style>
                    body { font-family: 'Inter', Arial, sans-serif; margin: 0; padding: 15px; }
                    .print-header { text-align: center; margin-bottom: 20px; }
                    .print-table { width: 100%; border-collapse: collapse; }
                    .print-table th, .print-table td { border: 1px solid #000; padding: 6px; text-align: center; vertical-align: middle; }
                    .print-table th { background: #f3f4f6; }
                    .print-footer { margin-top: 40px; text-align: right; }
                    @media print { @page { size: landscape; margin: 1.2cm; } }
                </style>
            </head>
            <body>${printHtml}</body>
            </html>
        `);
        printWindow.document.close();
        printWindow.print();
    }
    
    async function printGrades(task) {
        const assessmentsSnap = await db.ref(`penilaian/${task.id}`).once('value');
        const assessments = assessmentsSnap.val() || {};
        let assessList = Object.entries(assessments).map(([id, val]) => ({ id, date: val.date, topic: val.topic, scores: val.scores || {} }));
        assessList.sort((a,b) => (parseDMY(a.date)||0) - (parseDMY(b.date)||0));
        
        const siswaArray = task.siswaList.map(nis => {
            const data = allSiswa[nis] || { nama: '?', status: 'aktif' };
            return { nis, nama: data.nama, status: data.status };
        }).filter(s => s.nama !== '?');
        
        if (assessList.length === 0) {
            alert("Belum ada data penilaian untuk dicetak.");
            return;
        }
        
        let printHtml = `
            <div class="print-area">
                <div class="print-header">
                    <h1 style="font-size: 22px;">LAPORAN NILAI</h1>
                    <h2>${escapeHtml(task.mapelNama)}</h2>
                    <p>Kelas: ${escapeHtml(task.kelasDisplay)}</p>
                    <p>Guru: ${escapeHtml(currentTeacher)}</p>
                    <p>Tanggal Cetak: ${new Date().toLocaleDateString('id-ID')}</p>
                </div>
                <table class="print-table">
                    <thead>
                        <tr>
                            <th rowspan="2">No</th>
                            <th rowspan="2">NIS</th>
                            <th rowspan="2">Nama</th>`;
        for (let i = 0; i < assessList.length; i++) {
            printHtml += `<th rowspan="2">N${i+1}</th>`;
        }
        printHtml += `<th rowspan="2">Rata-Rata</th>
                    </tr>
                    <tr></thead>
                    <tbody>`;
        
        let no = 1;
        for (let siswa of siswaArray) {
            let totalNilai = 0;
            let countValid = 0;
            const isTidakAktif = (siswa.status === 'tidak_aktif');
            const styleNama = isTidakAktif ? 'color:#dc2626;font-weight:600;' : '';
            printHtml += `<tr>
                            <td>${no++}</td>
                            <td>${escapeHtml(siswa.nis)}</td>
                            <td style="text-align:left;${styleNama}">${escapeHtml(siswa.nama)}</td>`;
            for (let as of assessList) {
                let nilai = as.scores[siswa.nis] !== undefined ? as.scores[siswa.nis] : 0;
                if (nilai > 0) { totalNilai += nilai; countValid++; }
                printHtml += `<td>${nilai || '-'}</td>`;
            }
            let rata = assessList.length ? (totalNilai / assessList.length).toFixed(1) : 0;
            printHtml += `<td><strong>${rata}</strong></td>
                        </tr>`;
        }
        printHtml += `
                    </tbody>
                </table>
                <div class="print-footer">
                    <p>Mengetahui,</p>
                    <p style="margin-top: 40px;">(_____________________)</p>
                </div>
            </div>`;
        
        const printWindow = window.open('', '_blank');
        printWindow.document.write(`
            <html>
            <head>
                <title>Laporan Nilai - ${task.mapelNama}</title>
                <style>
                    body { font-family: 'Inter', Arial, sans-serif; margin: 0; padding: 15px; }
                    .print-header { text-align: center; margin-bottom: 20px; }
                    .print-table { width: 100%; border-collapse: collapse; }
                    .print-table th, .print-table td { border: 1px solid #000; padding: 6px; text-align: center; vertical-align: middle; }
                    .print-table th { background: #f3f4f6; }
                    .print-table td:nth-child(3) { text-align: left; }
                    .print-footer { margin-top: 40px; text-align: right; }
                    @media print {
                        @page { size: landscape; margin: 1.2cm; }
                        body { margin: 0; padding: 0; }
                    }
                </style>
            </head>
            <body>${printHtml}</body>
            </html>
        `);
        printWindow.document.close();
        printWindow.print();
    }

    // ========== TAMBAH PENUGASAN ==========
    async function prepareModalPenugasan() {
        const mapelSelect = document.getElementById('modalMapel');
        mapelSelect.innerHTML = '<option value="">-- Pilih Mapel --</option>';
        for (let [id, m] of Object.entries(allMapel)) mapelSelect.innerHTML += `<option value="${id}" data-jenis="${m.jenis}">${escapeHtml(m.nama)} (${m.jenis})</option>`;
        const targetDiv = document.getElementById('modalTargetInput');
        const updateTarget = () => {
            let jenis = mapelSelect.options[mapelSelect.selectedIndex]?.dataset?.jenis;
            if (!jenis) { targetDiv.innerHTML = '<div class="text-gray-500 text-sm">Pilih mata pelajaran dahulu</div>'; return; }
            if (jenis === 'inkul') {
                targetDiv.innerHTML = `<p class="text-xs mb-1">Pilih Kelas (bisa lebih dari satu)</p><select multiple size="4" class="w-full border rounded p-1 text-sm" id="targetKelasSelect">${allKelas.map(k=>`<option value="${k}">${escapeHtml(k)}</option>`).join('')}</select>`;
            } else {
                targetDiv.innerHTML = `<p class="text-xs mb-1">Pilih Siswa (bisa lebih)</p><select multiple size="5" class="w-full border rounded p-1 text-sm" id="targetSiswaSelect">${Object.entries(allSiswa).map(([nis,s])=>`<option value="${nis}">${escapeHtml(nis)} - ${escapeHtml(s.nama)} (${s.kelas})</option>`).join('')}</select>`;
            }
        };
        mapelSelect.onchange = updateTarget;
        updateTarget();
    }
    document.getElementById('btnTambahPenugasan').onclick = async () => { await prepareModalPenugasan(); document.getElementById('modalPenugasan').style.display = 'flex'; };
    document.getElementById('modalBatalBtn').onclick = () => document.getElementById('modalPenugasan').style.display = 'none';
    document.getElementById('modalSimpanBtn').onclick = async () => {
        const mapelSelect = document.getElementById('modalMapel');
        const mapelId = mapelSelect.value;
        if (!mapelId) { alert("Pilih Mata Pelajaran"); return; }
        const jenis = mapelSelect.options[mapelSelect.selectedIndex]?.dataset?.jenis;
        let siswaList = [];
        if (jenis === 'inkul') {
            const kelasSelect = document.getElementById('targetKelasSelect');
            if (!kelasSelect) return;
            const selectedKelas = Array.from(kelasSelect.selectedOptions).map(o=>o.value);
            if (!selectedKelas.length) { alert("Pilih minimal 1 kelas"); return; }
            for (let k of selectedKelas) for (let [nis,s] of Object.entries(allSiswa)) if (s.kelas === k) siswaList.push(nis);
            siswaList = [...new Set(siswaList)];
        } else {
            const siswaSelect = document.getElementById('targetSiswaSelect');
            if (!siswaSelect) return;
            siswaList = Array.from(siswaSelect.selectedOptions).map(o=>o.value);
            if (!siswaList.length) { alert("Pilih minimal 1 siswa"); return; }
        }
        if (!siswaList.length) { alert("Tidak ada siswa yang dipilih"); return; }
        await db.ref('penugasan').push({ mapelId, guruName: currentTeacher, siswaList });
        alert("Penugasan berhasil ditambahkan!");
        document.getElementById('modalPenugasan').style.display = 'none';
        await fetchInitialData();
        await renderAllCards();
    };

    window.onload = async () => {
        const guruLogin = localStorage.getItem('guruLogin');
        if (!guruLogin) { window.location.href = 'index.html'; return; }
        currentTeacher = guruLogin;
        document.getElementById('greeting').innerHTML = `<i class="fas fa-user-check"></i> ${escapeHtml(currentTeacher)} · Guru Aktif`;
        await fetchInitialData();
        await renderAllCards();
        document.getElementById('backToListBtn').onclick = backToList;

        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', (e) => {
                e.preventDefault();
                localStorage.removeItem('guruLogin');
                window.location.href = 'index.html';
            });
        }
    };
</script>
