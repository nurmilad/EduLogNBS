            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 34px;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;

            transition: .3s;

        }

        function parseDMY(dateStr) {
            if (!dateStr) return null;
            let parts = dateStr.split('/');
            if (parts.length === 3) {
                let d = parseInt(parts[0],10), m = parseInt(parts[1],10)-1, y = parseInt(parts[2],10);
                let date = new Date(y,m,d);
                if (!isNaN(date.getTime())) return date.getTime();
            }
            return null;
        }

        function formatDateToDMY(date) {
            let d = date.getDate().toString().padStart(2,'0');
            let m = (date.getMonth()+1).toString().padStart(2,'0');
            let y = date.getFullYear();
            return `${d}/${m}/${y}`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m] || m));
        }

        function getWarnaNilai(nilai) {
            if (nilai === '-' || nilai === null || isNaN(nilai)) return '';
            const n = parseFloat(nilai);
            if (n <= 0) return 'nilai-0';
            if (n <= 10) return 'nilai-10';
            if (n <= 20) return 'nilai-20';
            if (n <= 30) return 'nilai-30';
            if (n <= 40) return 'nilai-40';
            if (n <= 50) return 'nilai-50';
            if (n <= 60) return 'nilai-60';
            if (n <= 70) return 'nilai-70';
            if (n <= 80) return 'nilai-80';
            if (n <= 90) return 'nilai-90';
            return 'nilai-100';
        }

                </div>
            `;

            const toggle = document.getElementById('toggleHapusPenugasan');
            const statusLabel = document.getElementById('statusHapusLabel');

                const newValue = toggle.checked;
                statusLabel.textContent = newValue ? 'Aktif ✅' : 'Tidak Aktif ❌';
